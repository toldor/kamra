# Quality gates (AGENTS.md section 4, scope_contract DoD): build, format, lint, all tests, the
# OpenAPI contract check (ADR-0007), dependency vulnerability scan and the e2e smoke test.
name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # v1.2 2.3 secret hygiene: scan the whole git history on every push (gitleaks, MIT).
  secrets:
    runs-on: ubuntu-latest
    env:
      # Authenticated Docker Hub pulls: the anonymous limit is shared by GitHub runners.
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Log in to Docker Hub (gitleaks image; skipped without the secret)
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --no-banner --redact --exit-code 1

  backend:
    runs-on: ubuntu-latest
    env:
      # Authenticated Docker Hub pulls: the anonymous limit is shared by GitHub runners.
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build (warnings as errors, analyzers)
        run: dotnet build -warnaserror

      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

      - name: OpenAPI contract unchanged (generated on build, committed)
        run: git diff --exit-code -- src/backend/KamraApp.Api/openapi.json

      - name: Unit tests with coverage gate (Domain + Application line coverage >= 80%, test_strategy.md)
        run: >-
          dotnet test --no-build --project tests/KamraApp.Unit.Tests --coverlet --coverlet-output-format cobertura
          --coverlet-include "[KamraApp.Domain]*" --coverlet-include "[KamraApp.Application]*"
          --coverlet-threshold 80 --coverlet-threshold-type line

      - name: Log in to Docker Hub (Testcontainers pulls postgres:18; skipped without the secret)
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Integration tests (PostgreSQL in Testcontainers) with coverage
        run: dotnet test --no-build --project tests/KamraApp.Integration.Tests --coverlet --coverlet-output-format cobertura

      - name: Vulnerable NuGet packages
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: TestResults/*.cobertura.xml
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci

      - name: Generated API types match openapi.json (ADR-0007)
        run: npm run gen:api && git diff --exit-code -- src/api/schema.d.ts

      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Vulnerable npm packages
        run: npm audit --audit-level=high

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      # Authenticated Docker Hub pulls: the anonymous limit is shared by GitHub runners.
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Docker Hub (Compose pulls postgres:18 and node:24-alpine; skipped without the secret)
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start the Docker Compose stack
        env:
          # Placeholder values from .env.example; the e2e stack raises the login rate limit so
          # retries do not hit the production default of 10 requests per minute.
          RateLimiting__Auth__PermitLimit: '1000'
        run: |
          cp .env.example .env
          docker compose up -d --build
          for i in $(seq 1 90); do curl -fs http://localhost:8080/health && break; sleep 2; done
          curl -fs http://localhost:8080/health

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Playwright (desktop Chrome and 360 px)
        working-directory: tests/e2e
        env:
          E2E_BASE_URL: http://localhost:8080
          CI: 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
